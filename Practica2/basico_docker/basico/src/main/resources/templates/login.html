<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Estilos específicos para centrar el login en la pantalla */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a24 0%, #0f0f13 100%);
        }
        .login-card {
            background: rgba(26, 26, 36, 0.9);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h1 class="mb-4 fw-bold">
            <i class="bi bi-controller text-neon-purple"></i> 
            <span class="text-white">NEXUS</span> <span class="text-neon-green">GAMES</span>
        </h1>
        
        <div th:if="${param.error}" class="alert alert-danger border-danger bg-transparent text-danger">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success border-success bg-transparent text-success">
            Has cerrado sesión correctamente.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3 text-start">
                <label class="form-label text-neon-purple">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-neon-purple"><i class="bi bi-person"></i></span>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="Tu usuario" required autofocus />
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label class="form-label text-neon-purple">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-dark border-secondary text-neon-purple"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" placeholder="••••••••" required />
                </div>
            </div>
            
            <button type="submit" class="btn btn-neon w-100 py-2 fs-5 fw-bold">ENTRAR AL NEXO</button>
        </form>
    </div>
</body>
</html>
