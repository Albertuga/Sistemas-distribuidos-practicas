<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a24 0%, #0f0f13 100%);
        }
        .login-card {
            background: rgba(26, 26, 36, 0.9);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="mb-4 fw-bold">
            <i class="bi bi-person-plus text-neon-purple"></i> 
            <span class="text-white">Únete a</span> <span class="text-neon-green">NEXUS GAMES</span>
        </h2>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="row">
                <div class="col-6 mb-3 text-start">
                    <label class="form-label text-neon-purple">Usuario (Login)</label>
                    <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{username}" required>
                </div>
                <div class="col-6 mb-3 text-start">
                    <label class="form-label text-neon-purple">Contraseña</label>
                    <input type="password" class="form-control bg-dark text-white border-secondary" th:field="*{password}" required>
                </div>
            </div>

            <div class="mb-3 text-start">
                <label class="form-label text-neon-purple">Nombre Completo</label>
                <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{nombreUsuario}" required>
            </div>

            <div class="mb-4 text-start">
                <label class="form-label text-neon-purple">Correo Electrónico</label>
                <input type="email" class="form-control bg-dark text-white border-secondary" th:field="*{emailuser}" required>
            </div>
            
            <button type="submit" class="btn btn-neon w-100 py-2 fs-5 fw-bold mb-3">CREAR CUENTA</button>
            
            <a th:href="@{/login}" class="text-secondary text-decoration-none" onmouseover="this.style.color='var(--neon-green)'" onmouseout="this.style.color='#6c757d'">
                <i class="bi bi-arrow-left"></i> Volver al Login
            </a>
        </form>
    </div>
</body>
</html>
