<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-dark p-4 border-neon-green">
                    <h3 class="text-white mb-4 text-center"><i class="bi bi-credit-card text-neon-green"></i> Pasarela de Pago Segura</h3>
                    
                    <div class="alert alert-secondary bg-dark border-secondary text-white mb-4">
                        Estás a punto de pagar tu carrito con <strong><span class="text-neon-purple" th:text="${cantidadItems}"></span> artículos</strong> por un total de <strong class="text-neon-green" th:text="${total + ' €'}">0.00 €</strong>.
                    </div>

                    <form th:action="@{/pago/procesar}" method="post">
                        <div class="mb-3">
                            <label class="text-secondary">Titular de la tarjeta</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="EJ: JOHN DOE" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="text-secondary">Número de Tarjeta (Simulación)</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="1234 5678 9101 1121" maxlength="19" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-6 mb-4">
                                <label class="text-secondary">Caducidad</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="MM/YY" required>
                            </div>
                            <div class="col-6 mb-4">
                                <label class="text-secondary">CVC</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" placeholder="123" maxlength="3" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-neon w-100 fw-bold" style="border-color: var(--neon-green); color: var(--neon-green);">
                                Pagar <span th:text="${total + ' €'}">0.00 €</span>
                            </button>
                            <a th:href="@{/carrito}" class="btn btn-outline-secondary w-100 mt-2">Volver al Carrito</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
