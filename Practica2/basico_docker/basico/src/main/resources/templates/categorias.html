<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white"><i class="bi bi-tags text-neon-purple"></i> Gestión de Categorías</h2>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/categorias/nueva}" class="btn btn-neon"><i class="bi bi-plus-lg"></i> Nueva Categoría</a>
        </div>

        <div class="card card-dark p-0 overflow-hidden">
            <table class="table table-dark table-hover mb-0">
                <thead>
                    <tr>
                        <th class="text-neon-green">ID</th>
                        <th class="text-neon-green">Nombre</th>
                        <th class="text-neon-green">Descripción</th>
                        <th sec:authorize="hasAuthority('ROLE_ADMIN')" class="text-neon-green text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td colspan="4" class="text-center text-secondary py-4">No hay categorías registradas.</td>
                    </tr>
                    <tr th:each="categoria : ${categorias}">
                        <td th:text="${categoria.id}">1</td>
                        <td th:text="${categoria.nombre}" class="fw-bold">Acción</td>
                        <td th:text="${categoria.descripcion}">Juegos de disparos y acción rápida</td>
                        <td sec:authorize="hasAuthority('ROLE_ADMIN')" class="text-center">
                            <a th:href="@{/categorias/editar/{id}(id=${categoria.id})}" class="btn btn-sm btn-outline-warning me-2" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/categorias/eliminar/{id}(id=${categoria.id})}" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Estás seguro de que deseas eliminar esta categoría?');">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
