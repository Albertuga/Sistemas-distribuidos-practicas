<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card card-dark p-4 border-neon-purple text-center">
                    
                    <div class="mb-4">
                        <div class="bg-dark d-inline-block rounded-circle p-4 border border-secondary" style="width: 100px; height: 100px;">
                            <h1 class="text-neon-purple mb-0"><i class="bi bi-person-badge"></i></h1>
                        </div>
                        <h3 class="mt-3 text-white fw-bold" th:text="${usuario.nombreUsuario}">Nombre Completo</h3>
                        <span class="badge bg-purple-glow text-neon-purple border border-purple" 
                              th:text="${usuario.userRole.roleName}" 
                              style="background-color: rgba(139, 92, 246, 0.1);">ROLE_USER</span>
                    </div>

                    <hr class="border-secondary my-4">

                    <div class="text-start px-3">
                        <div class="mb-3">
                            <span class="text-secondary d-block" style="font-size: 0.85em;">Nombre de Usuario</span>
                            <span class="text-white fs-5 fw-bold th-neon-text" th:text="${usuario.username}">username</span>
                        </div>
                        
                        <div class="mb-3">
                            <span class="text-secondary d-block" style="font-size: 0.85em;">Correo Electrónico</span>
                            <span class="text-white fs-5" th:text="${usuario.emailuser}">correo@test.com</span>
                        </div>

                        <div class="mb-2">
                            <span class="text-secondary d-block" style="font-size: 0.85em;">Último Acceso Registrado</span>
                            <span class="text-neon-green fs-6">
                                <i class="bi bi-clock-history"></i> 
                                <span th:text="${#temporals.format(usuario.fechaUltimoAcceso, 'dd-MM-yyyy HH:mm')}">21-04-2026 12:00</span>
                            </span>
                        </div>
                    </div>

                    <div class="mt-4">
                        <a th:href="@{/}" class="btn btn-neon w-100">Volver al Inicio</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
