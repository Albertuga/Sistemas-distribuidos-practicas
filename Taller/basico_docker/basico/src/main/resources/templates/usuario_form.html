<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuario - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-dark p-4 border-neon-green">
                    <h3 class="text-center text-white mb-4">
                        <span th:if="${usuario.id == null}"><i class="bi bi-person-plus text-neon-green"></i> Añadir Usuario</span>
                        <span th:if="${usuario.id != null}"><i class="bi bi-person-gear text-neon-green"></i> Editar Usuario</span>
                    </h3>

                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                        <input type="hidden" th:field="*{id}" />

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-neon-purple">Nombre de Usuario (Login)</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{username}" required placeholder="Ej: jgamer99">
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-neon-purple">
                                    Contraseña <span th:if="${usuario.id != null}" class="text-secondary" style="font-size: 0.8em;">(Dejar en blanco para mantener actual)</span>
                                </label>
                                <input type="password" class="form-control bg-dark text-white border-secondary" th:field="*{password}" th:required="${usuario.id == null}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-neon-purple">Nombre Completo</label>
                                <input type="text" class="form-control bg-dark text-white border-secondary" th:field="*{nombreUsuario}" required placeholder="Ej: Juan Pérez">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-neon-purple">Correo Electrónico</label>
                                <input type="email" class="form-control bg-dark text-white border-secondary" th:field="*{emailuser}" required placeholder="juan@ejemplo.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-neon-purple">Rol del Sistema</label>
                            <select class="form-select bg-dark text-white border-secondary" th:field="*{userRole.id}" required>
                                <option value="" disabled selected>Selecciona un rol...</option>
                                <option th:each="rol : ${listaRoles}" 
                                        th:value="${rol.id}" 
                                        th:text="${rol.roleName}">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/usuarios}" class="btn btn-outline-secondary me-md-2">Cancelar</a>
                            <button type="submit" class="btn btn-neon">Guardar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
