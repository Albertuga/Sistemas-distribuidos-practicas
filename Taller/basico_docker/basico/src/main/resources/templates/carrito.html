<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Carrito - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <h2 class="text-white mb-4"><i class="bi bi-cart3 text-neon-green"></i> Tu Carrito de Compras</h2>

        <div class="row">
            <div class="col-md-8">
                <div class="card card-dark p-0 overflow-hidden mb-4 border-secondary">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead>
                            <tr>
                                <th class="text-neon-purple">Juego</th>
                                <th class="text-neon-purple text-end">Precio</th>
                                <th class="text-center text-neon-purple">Acción</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(carrito)}">
                                <td colspan="3" class="text-center text-secondary py-4">Tu carrito está vacío. ¡Ve al catálogo!</td>
                            </tr>
                            <tr th:each="juego, stat : ${carrito}">
                                <td th:text="${juego.titulo}" class="fw-bold text-white">Juego</td>
                                <td th:text="${juego.precio + ' €'}" class="text-end text-neon-green">0.00 €</td>
                                <td class="text-center">
                                    <a th:href="@{/carrito/remove/{indice}(indice=${stat.index})}" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-lg"></i> Quitar
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card card-dark p-4 border-neon-green">
                    <h4 class="text-white mb-3">Resumen del Pedido</h4>
                    <div class="d-flex justify-content-between mb-3">
                        <span class="text-secondary">Artículos:</span>
                        <span class="text-white fw-bold" th:text="${#lists.size(carrito)}">0</span>
                    </div>
                    <hr class="border-secondary">
                    <div class="d-flex justify-content-between mb-4">
                        <span class="text-white fs-5">Total:</span>
                        <span class="text-neon-green fs-4 fw-bold" th:text="${total + ' €'}">0.00 €</span>
                    </div>
                    
                    <a th:if="${!#lists.isEmpty(carrito)}" th:href="@{/pago/checkout}" class="btn btn-neon w-100 fw-bold fs-5">
                        <i class="bi bi-credit-card"></i> Pagar Ahora
                    </a>
                    <a th:href="@{/videojuegos}" class="btn btn-outline-secondary w-100 mt-2">Seguir Comprando</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
