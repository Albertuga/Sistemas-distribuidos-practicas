<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Videojuegos - Nexus Games</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-white"><i class="bi bi-controller text-neon-purple"></i> Catálogo de Videojuegos</h2>
            <div class="d-flex gap-3">
                <form th:action="@{/videojuegos}" method="get" class="d-flex">
                    <div class="input-group">
                        <input type="text" name="buscar" th:value="${buscar}" class="form-control bg-dark text-white border-secondary" placeholder="Buscar juego...">
                        <button class="btn btn-outline-secondary text-neon-purple" type="submit"><i class="bi bi-search"></i></button>
                        <a th:if="${buscar != null and !buscar.isEmpty()}" th:href="@{/videojuegos}" class="btn btn-outline-danger"><i class="bi bi-x-lg"></i></a>
                    </div>
                </form>
            <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/videojuegos/nuevo}" class="btn btn-neon"><i class="bi bi-plus-lg"></i> Añadir Juego</a>
        </div>
 </div>
        <div class="card card-dark p-0 overflow-hidden">
            <table class="table table-dark table-hover mb-0 align-middle">
                <thead>
                    <tr>
                        <th class="text-neon-green">ID</th>
                        <th class="text-neon-green">Título</th>
                        <th class="text-neon-green">Categoría</th>
                        <th class="text-neon-green">Precio</th>
                        <th class="text-neon-green">Stock</th>
                        <th sec:authorize="hasAuthority('ROLE_ADMIN')" class="text-neon-green text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(videojuegos)}">
                        <td colspan="6" class="text-center text-secondary py-4">El catálogo está vacío. Añade tu primer juego.</td>
                    </tr>
                    <tr th:each="juego : ${videojuegos}">
                        <td th:text="${juego.id}">1</td>
                        <td>
                            <a th:href="@{/videojuegos/detalle/{id}(id=${juego.id})}" class="text-neon-purple text-decoration-none fw-bold" style="transition: 0.3s;" onmouseover="this.style.textShadow='0 0 10px rgba(139, 92, 246, 0.8)'" onmouseout="this.style.textShadow='none'" th:text="${juego.titulo}">
                                Título del Juego
                            </a>
                        </td>
                        <td th:text="${juego.categoria.nombre}">RPG</td>
                        <td th:text="${juego.precio + ' €'}">59.99 €</td>
                        <td>
                            <span th:if="${juego.stock > 0}" th:text="${juego.stock}" class="badge bg-success">10</span>
                            <span th:if="${juego.stock == 0}" class="badge bg-danger">Agotado</span>
                        <td class="text-center">
                            <a th:href="@{/carrito/add/{id}(id=${juego.id})}" th:classappend="${juego.stock == 0 ? 'disabled' : ''}" class="btn btn-sm btn-outline-success me-2" title="Añadir al Carrito">
                                <i class="bi bi-cart"></i> Añadir
                            </a>
                            
                            <span sec:authorize="hasAuthority('ROLE_ADMIN')">
                                <a th:href="@{/videojuegos/editar/{id}(id=${juego.id})}" class="btn btn-sm btn-outline-warning me-2" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/videojuegos/eliminar/{id}(id=${juego.id})}" class="btn btn-sm btn-outline-danger" title="Eliminar" onclick="return confirm('¿Seguro que deseas eliminar este juego del catálogo?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
